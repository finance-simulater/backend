name: Test

on:
  pull_request:
    branches:
      - main
    # paths-ignore를 두지 않는다 — Test를 branch protection 필수 체크로 지정하면, 워크플로가 스킵된
    # 문서 전용 PR은 체크가 "Expected"로 영구 대기해 merge가 막힌다 (#41).
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: sqlite:///./test.db
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-that-is-at-least-32-bytes
      DEBUG: "True"
      MYSQL_PORT: 3306
      # 아래 3개 값은 services.mysql.env가 그대로 참조한다(중복 정의 방지).
      MYSQL_DATABASE: finance_test
      MYSQL_USER: finance_test_user
      MYSQL_PASSWORD: test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR에선 HEAD가 merge 커밋이라 첫 번째 부모(HEAD^1)가 merge 기준 base다 — 포인터 검사의 base로 쓴다.
          fetch-depth: 2

      # spec 레포가 private이라 submodules: true로는 받을 수 없다(GITHUB_TOKEN은 이 레포 권한만 있음).
      # spec 읽기 전용 deploy key로 main을 히스토리 전체(fetch-depth: 0)와 함께 받는다 — 포인터 검사에
      # origin/main과 조상 관계가 필요하고, 포인터 커밋으로의 전환은 그 뒤 로컬에서 한다.
      - name: Checkout spec
        uses: actions/checkout@v4
        with:
          repository: finance-simulater/spec
          ref: main
          fetch-depth: 0
          path: spec
          ssh-key: ${{ secrets.SPEC_DEPLOY_KEY }}
          # 이후 단계에서 spec을 원격에서 다시 받지 않으므로 키를 git 설정에 남기지 않는다.
          persist-credentials: false

      - name: Test spec pointer check script
        run: sh scripts/test_check_spec_pointer.sh

      # PR merge 결과의 포인터가 spec main에 있는 커밋이고 base 포인터보다 앞서 있는지 검사한다 (#41).
      # base는 이벤트 시점 값인 pull_request.base.sha 대신 merge 커밋의 실제 부모(HEAD^1)를 쓴다.
      # workflow_call(deploy)은 caller 이벤트(push)를 그대로 받으므로 여기서 건너뛴다.
      - name: Check spec submodule pointer
        if: github.event_name == 'pull_request'
        run: sh scripts/check_spec_pointer.sh "$(git rev-parse HEAD^1:spec)" "$(git rev-parse HEAD:spec)" spec

      # push·deploy 등 모든 이벤트의 안전망: fetch-depth: 0으로 spec 기능 브랜치도 받아오므로, checkout만으론
      # main에 없는 커밋을 막지 못한다. 포인터가 spec main 히스토리에 있는지 확인한 뒤 전환한다.
      - name: Switch spec to submodule pointer
        run: |
          SPEC_PTR="$(git rev-parse HEAD:spec)"
          if ! git -C spec merge-base --is-ancestor "$SPEC_PTR" origin/main; then
            echo "::error::spec 포인터($SPEC_PTR)가 spec main 히스토리에 없는 커밋"
            exit 1
          fi
          git -C spec checkout --quiet --detach "$SPEC_PTR"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        # pyproject.toml의 dev 의존성 그룹(pytest, cryptography, httpx2)을 uv.lock
        # 그대로 설치한다. PyMySQL이 MySQL 8 기본 인증(caching_sha2_password)의
        # RSA 키 교환에 필요로 하는 cryptography를 빠뜨리지 않기 위해 개별
        # 패키지를 골라 설치하지 않고 락파일 전체를 설치한다.
        run: uv sync --locked

      - name: Compile check
        run: uv run python -m compileall app alembic

      - name: Run unit tests
        run: uv run pytest -q

      - name: Run integration tests (real MySQL)
        run: uv run pytest -q -m integration
