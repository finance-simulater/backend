name: Docs

# spec/api/openapi.yaml을 Swagger UI 정적 페이지로 GitHub Pages에 배포한다 (#76).
# spec 레포는 private이라 Pages를 쓸 수 없어 public인 이 레포에서 배포한다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포는 끊지 않는다 — 대기 중인 최신 실행만 남고 그 사이 실행은 건너뛴다 (GitHub Pages 템플릿과 동일).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # test.yml과 같이 spec 읽기 전용 deploy key로 받는다(GITHUB_TOKEN은 이 레포 권한만 있음).
      - name: Checkout spec
        uses: actions/checkout@v4
        with:
          repository: finance-simulater/spec
          ref: main
          fetch-depth: 0
          path: spec
          ssh-key: ${{ secrets.SPEC_DEPLOY_KEY }}
          persist-credentials: false

      # 문서가 main 코드와 같은 버전의 스펙을 보여주도록 서브모듈 포인터 커밋으로 전환한다.
      # 실패 원인을 알 수 있도록 포인터를 출력하고, test.yml과 같이 spec main 히스토리에 있는지 먼저 확인한다.
      - name: Switch spec to submodule pointer
        run: |
          SPEC_PTR="$(git rev-parse HEAD:spec)"
          echo "spec 포인터: $SPEC_PTR"
          if ! git -C spec merge-base --is-ancestor "$SPEC_PTR" origin/main; then
            echo "::error::spec 포인터($SPEC_PTR)가 spec main 히스토리에 없는 커밋"
            exit 1
          fi
          git -C spec checkout --quiet --detach "$SPEC_PTR"

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/swagger/index.html _site/
          cp spec/api/openapi.yaml _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
