name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # code-review 플러그인은 리뷰 에이전트를 백그라운드로 띄운 채 세션이 끝나 코멘트가 게시되지 않는다 (#53).
          # 리뷰 지시를 prompt에 직접 작성하고, 세션 안에서 끝까지 리뷰한 뒤 게시하게 한다.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰하고 결과를 PR에 게시해줘. 모든 코멘트는 한국어로 작성해.

            - `gh pr view`, `gh pr diff`로 변경 내용을 확인하고, 필요하면 저장소 파일을 직접 읽어 맥락을 파악해.
            - 버그, 보안 문제, 엣지 케이스 누락, 테스트 누락 등 실제로 문제가 되는 것 위주로 지적해. 스타일 취향 지적은 하지 마.
            - 서브에이전트나 백그라운드 작업을 쓰지 말고 직접 리뷰를 끝낸 뒤 게시해.
            - 특정 코드 줄에 대한 지적은 `mcp__github_inline_comment__create_inline_comment`로 인라인 코멘트를 남겨.
            - 마지막에 `gh pr comment`로 전체 요약 코멘트를 하나 남겨. 문제가 없으면 문제없다고 짧게 남겨.
          # 자동 실행(prompt 지정) 모드는 Bash 도구가 기본 차단돼 리뷰 결과를 PR에 게시하지 못한다 (#49).
          # 리뷰에 필요한 gh 명령과 인라인 코멘트 도구만 허용한다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

