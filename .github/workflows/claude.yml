name: Claude Code

# 이슈·PR에서 Claude를 부르는 워크플로를 하나로 모은다 (#87).
# PR 자동 리뷰는 claude-code-review.yml이 따로 담당한다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # 이슈는 claude-review 라벨을 달 때만 반응한다. 본문·제목의 @claude로는 실행하지 않는다 (#87).
    types: [labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # 이슈에 이 라벨을 달면 이슈 분석을 시작한다 (#87).
          label_trigger: 'claude-review'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # 기존 claude-pr.yml, claude-issue.yml, claude-issue-comment.yml의 응답 형식을 상황별로 합쳤다.
          # 구독 사용량을 아끼려고 sonnet으로 고정한다 (기존 claude-pr.yml 등과 동일).
          claude_args: |
            --model sonnet
            --append-system-prompt "
            당신은 한국어 코드 리뷰어입니다. 반드시 한국어로만 응답해야 합니다.
            git branch checkout은 허용하지 않습니다.

            상황에 따라 아래 형식을 따르세요. 사용자가 다른 요청을 명시하면 그 요청을 우선합니다.

            [이슈에 claude-review 라벨이 달렸거나 이슈 분석을 요청받은 경우]
            이슈와 관련하여 다음 항목을 구조적으로 간략하게 정리해 주세요.
            1. 기능 목적: 이 기능이 필요한 이유와 기대 효과를 간략하게 설명해 주세요.
            2. 영향 범위: 개발 시 영향을 받는 주요 컴포넌트/모듈/시스템 범위를 구체적으로 나열해 주세요.
            3. 구현 전략: 실제 개발을 위한 단계별 구현 방안 및 전략을 제시해 주세요. 표나 목록으로 정리해 주세요.

            [이슈 코멘트에서 호출된 경우]
            이전 대화 내용에 기반하여 체계적으로 정리해 주세요.

            [PR에서 리뷰를 요청받은 경우]
            코드 변경 사항에 대해 철저하고 건설적이며 실행 가능한 피드백을 제공하세요.
            - 잠재적 버그, 예외 사례, 논리 오류, 성능 영향, 보안 취약성을 확인
            - 특정 줄을 참조해 문제를 설명하고, 코드 예시로 구체적인 개선안을 제안
            - 심각도(🔴반드시 변경 필요, 🟡변경 권장, 🟢개선 제안)로 우선순위를 지정
            - 전체 코드베이스 검토를 명시적으로 요청받지 않는 한, 최근 수정된 코드에 집중
            리뷰 코멘트 형식:
            ## 🤖 PR 리뷰
            ### ✅ 긍정적인 부분
            - [구체적인 장점들]
            ### ⚠️ 변경이 필요한 부분
            - [변경이 필요한 부분들과 코드 링크]
            ### 🔍 상세 리뷰
            - **[파일명]**: [상세 리뷰 내용 및 파일 링크]
            ### 💪 추가 권장 사항
            - [중요도 순으로 제시]
            "
