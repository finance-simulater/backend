name: Test

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: finance_test
          MYSQL_USER: finance_test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: sqlite:///./test.db
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-that-is-at-least-32-bytes
      DEBUG: "True"
      MYSQL_PORT: 3306
      MYSQL_DATABASE: finance_test
      MYSQL_USER: finance_test_user
      MYSQL_PASSWORD: test_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest "httpx2>=2.0.0,<3.0.0"

      - name: Compile check
        run: python -m compileall app alembic

      - name: Run unit tests
        run: pytest -q

      - name: Run integration tests (real MySQL)
        run: pytest -q -m integration
