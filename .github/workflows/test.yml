name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: sqlite:///./test.db
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-that-is-at-least-32-bytes
      DEBUG: "True"
      MYSQL_PORT: 3306
      # 아래 3개 값은 services.mysql.env가 그대로 참조한다(중복 정의 방지).
      MYSQL_DATABASE: finance_test
      MYSQL_USER: finance_test_user
      MYSQL_PASSWORD: test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # spec 레포가 private이라 submodules: true로는 받을 수 없다(GITHUB_TOKEN은 이 레포 권한만 있음).
      # spec 읽기 전용 deploy key로 서브모듈 포인터가 가리키는 커밋을 직접 checkout한다.
      # 포인터가 원격에 없는 커밋이면 여기서 실패하므로 잘못된 포인터가 main에 들어오는 것도 막는다.
      - name: Resolve spec submodule commit
        id: spec
        run: echo "sha=$(git rev-parse HEAD:spec)" >> "$GITHUB_OUTPUT"

      - name: Checkout spec submodule
        uses: actions/checkout@v4
        with:
          repository: finance-simulater/spec
          ref: ${{ steps.spec.outputs.sha }}
          path: spec
          ssh-key: ${{ secrets.SPEC_DEPLOY_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        # pyproject.toml의 dev 의존성 그룹(pytest, cryptography, httpx2)을 uv.lock
        # 그대로 설치한다. PyMySQL이 MySQL 8 기본 인증(caching_sha2_password)의
        # RSA 키 교환에 필요로 하는 cryptography를 빠뜨리지 않기 위해 개별
        # 패키지를 골라 설치하지 않고 락파일 전체를 설치한다.
        run: uv sync --locked

      - name: Compile check
        run: uv run python -m compileall app alembic

      - name: Run unit tests
        run: uv run pytest -q

      - name: Run integration tests (real MySQL)
        run: uv run pytest -q -m integration
