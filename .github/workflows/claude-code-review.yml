name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # 액션은 첫 result에서 실행을 끝내므로, 서브에이전트가 백그라운드로 돌면 결과 없이 success로 끝난다 (#53).
          # 최근 Claude Code는 서브에이전트를 기본으로 백그라운드에서 실행해, 메인 세션이 결과를 기다리지 않고 끝날 수 있다.
          # code-review 플러그인은 서브에이전트에 의존하므로 백그라운드 실행 옵션을 막는다. 병렬 실행은 그대로 동작한다 (#87).
          # 참고: https://github.com/anthropics/claude-code-action/issues/1499
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment가 없으면 플러그인은 리뷰만 하고 PR에 코멘트를 게시하지 않는다 (#87).
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # 필요한 gh 명령과 인라인 코멘트 도구 권한은 플러그인 명령 파일(allowed-tools)에 선언돼 있다.
          claude_args: |
            --append-system-prompt "모든 리뷰 코멘트는 한국어로 작성하세요."
          # 리뷰가 게시되지 않는 원인 확인용 임시 설정. 확인 후 제거한다 (#94).
          # 공개 저장소라 Claude의 도구 입출력이 Actions 로그에 그대로 공개된다.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
